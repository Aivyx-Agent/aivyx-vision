[package]
name = "aivyx-vision-mold"
description = "HTTP-client backend for Aivyx-Vision's GenerationProvider trait, talking to an operator-run `mold serve` instance for image generation, coordinated via aivyx-broker's GPU lock"
version = "0.1.0"
edition = "2024"
license = "BUSL-1.1"
publish = false

[dependencies]
aivyx-vision-core = { path = "../aivyx-vision-core" }
async-trait = "0.1.89"
base64 = "0.22"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.18"
# "time" is for tokio::time::timeout -- every mold_client.rs/
# gpu_lock_client.rs request is now wrapped in an overall per-request
# deadline, not only reqwest's own per-read timeout (see mold_client.rs's
# DEFAULT_MOLD_OVERALL_TIMEOUT doc comment for why).
tokio = { version = "1.52.3", features = ["rt", "time"] }
tracing = "0.1.44"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"
# "time" is for tokio::time::sleep in the cancellation-safety regression
# test (and the overall-deadline trickle tests below) -- previously only
# compiled via a feature wiremock happened to pull in transitively, not
# anything this crate declared itself. "net"/"io-util" are for the raw
# `tokio::net::TcpListener` mock the overall-deadline trickle tests use
# (wiremock has no primitive for streaming a response body slowly one
# small write at a time, which is the exact shape of bug this is
# regression-testing).
tokio = { version = "1.52.3", features = ["macros", "time", "net", "io-util"] }
wiremock = "0.6.5"
