# cargo-deny configuration — dependency license policy.
#
# Run: `cargo deny check licenses`
#
# aivyx-vision relicenses MIT OR Apache-2.0 -> BUSL-1.1 (see LICENSE).
# For that to be lawful, NO dependency may impose copyleft (GPL/
# LGPL-only/AGPL/MPL/SSPL/EPL/CDDL) on the combined work. This
# allow-list is therefore permissive-only and deliberately omits every
# copyleft license: cargo-deny rejects anything not listed, so a future
# copyleft dep fails the gate loudly instead of silently poisoning the
# relicense.
#
# The list matches aivyx-pa's own established allow-list exactly (that
# repo went through this same relicense first, and its own audit found a
# real GPL-3.0 blocker before settling on this list) — reused rather
# than redrafted so every repo in the ecosystem applies the identical
# policy.

[graph]
all-features = true

[licenses]
version = 2
# Skip aivyx-vision's OWN workspace crates: they relicense to BUSL-1.1
# (this gate's whole purpose), so they must not be measured against the
# dependency allow-list below. Scoped to first-party crates marked
# publish = false -- this repo has no [workspace.package] to set it
# workspace-wide, so each of the 3 crates (aivyx-vision-svg,
# aivyx-vision-core, aivyx-vision-mold) sets publish = false directly in
# its own [package] block instead; private.ignore keys off that same
# per-crate flag either way. A THIRD-PARTY crate under BUSL/any
# copyleft still fails loudly, which is the point.
private = { ignore = true }
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "BSL-1.0",
    "0BSD",
    "Unlicense",
    "WTFPL",
    "CC0-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",
    "NCSA",
    # MPL-2.0 is *file-level* (weak) copyleft: it never relicenses the
    # larger combined work -- the only obligation is to share
    # modifications to the MPL-licensed files themselves. No dependency
    # in aivyx-vision's own graph is currently MPL-2.0 licensed --
    # verified directly, `cargo deny check licenses --all-features`
    # reports it as an unmatched allowance here, same as WTFPL/
    # Unicode-DFS-2016 below. Kept in the list anyway for consistency
    # with the org-wide policy (every ecosystem repo's deny.toml carries
    # the same allow-list; a future dependency update elsewhere in this
    # workspace that does pull in an MPL-2.0 crate stays green without
    # needing a config change), not because one exists here today.
    "MPL-2.0",
]

# No per-crate license exceptions. `cargo deny check licenses`
# (all-features) is green with no exceptions -- verified directly
# against this exact allow-list before this file was committed. Any
# future copyleft dep now fails the gate loudly.
